<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Cafe</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS Tambahan untuk Fitur QR & Meja */
        .grid-meja {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .btn-meja {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            transition: background 0.3s;
        }
        .btn-meja.terisi {
            background-color: #c0392b;
        }
        .btn-meja.aktif {
            border: 3px solid #f39c12;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-riwayat {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
        }
        .btn-riwayat:hover {
            background-color: #2980b9;
        }
        .btn-selesai {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1.05rem;
        }
        .btn-selesai:hover {
            background-color: #d35400;
        }
        .modal-meja-info {
            font-size: 1rem;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* Style Pilihan Metode Pembayaran */
        .tab-pembayaran {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-tab {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            background: #fff;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
            color: #555;
        }
        .btn-tab.active {
            border-color: #e67e22;
            background: #fdf6f0;
            color: #e67e22;
        }
        
        /* Area Konten QR */
        .qr-container {
            display: none;
            text-align: center;
            margin: 1px 0;
            background: #fff;
            padding: 1px;
            border: 1px solid #eee;
            border-radius: 1px;
        }
        .qr-image {
            width: 400px;
            height: 400px;
            object-fit: contain;
            margin-bottom: 3px;
        }
        .qr-info-scan {
            font-size: 0.85rem;
            color: #777;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>☕  angkring kenangan </h1>
        <p>Digital payout A.K </p>
    </header>

    <div class="container">
        <div class="menu-section">
            <h2>Daftar Menu</h2>
            <div class="grid-menu" id="menu-container">
                </div>
        </div>

        <div class="order-section">
            <h2>Daftar Pesanan & Meja</h2>
            
            <div class="grid-meja" id="meja-container">
                </div>
            
            <h3 id="label-meja-aktif" style="margin-bottom: 10px; color: #4a3728;">Mengedit: Meja 1</h3>

            <table class="tabel-pesanan">
                <thead>
                    <tr>
                        <th>Menu</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="list-pesanan">
                    </tbody>
            </table>

            <div class="total-box">
                <div class="total-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">Rp 0</span>
                </div>
                <div class="total-row grand-total">
                    <span>Total Akhir:</span>
                    <span id="total-akhir" data-value="0">Rp 0</span>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-riwayat" id="btn-cetak-bill">1. Cetak Bill (Simpan ke Meja)</button>
                <button class="btn-selesai" id="btn-buka-pembayaran">2. Proses Pembayaran (Bayar)</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-pembayaran">
        <div class="modal-content">
            <h2>Tagihan Pembayaran</h2>
            <div id="modal-info-meja" class="modal-meja-info">Meja: -</div>
            <hr>
            <div class="info-tagihan">
                <p>Total yang harus dibayar:</p>
                <h1 id="modal-total-tagihan">Rp 0</h1>
            </div>

            <div class="tab-pembayaran">
                <button class="btn-tab active" id="tab-tunai" onclick="gantiMetode('tunai')">💵 Tunai / Cash</button>
                <button class="btn-tab" id="tab-qr" onclick="gantiMetode('qr')">📸 QR Code / QRIS</button>
            </div>

            <div id="panel-tunai">
                <div class="bayar-box">
                    <label for="input-bayar">Masukkan Nominal Uang Tunai (Rp):</label>
                    <input type="number" id="input-bayar" placeholder="Contoh: 50000">
                </div>
                <div class="kembalian-box">
                    <span>Kembalian:</span>
                    <span id="kembalian-teks">Rp 0</span>
                </div>
            </div>

            <div id="panel-qr" class="qr-container">
                <img src="qr-code.png" alt="QR Code Pembayaran" class="qr-image" onerror="this.src='https://via.placeholder.com/200?text=Foto+QR+Belum+Ada'">
                <div class="qr-info-scan">Silakan Scan QR Di Atas Pas Sesuai Tagihan</div>
            </div>

            <div class="modal-actions">
                <button class="btn-batal" id="btn-batal-bayar">Kembali</button>
                <button class="btn-cetak" id="btn-proses-transaksi">Bayar & Kosongkan Meja</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
